<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexo Tiers</title>
<link rel="preload" href="https://raw.githubusercontent.com/Toggelt/nexo-tiers/main/assets/26.2-Minecraft-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800;900&display=swap">
<link rel="icon" type="image/x-icon" href="https://github.com/Toggelt/nexo-tiers/blob/main/assets/favicon.ico?raw=true">
<style>
@font-face { font-family: 'Minecraft'; src: url('https://raw.githubusercontent.com/Toggelt/nexo-tiers/main/assets/26.2-Minecraft-Regular.otf') format('opentype'); font-weight: normal; font-style: normal; font-display: swap; }
@font-face { font-family: 'MinecraftBold'; src: url('https://raw.githubusercontent.com/Toggelt/nexo-tiers/main/assets/3%20Minecraft-Bold.otf') format('opentype'); font-weight: normal; font-style: normal; font-display: swap; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #0b0b0e; color: #fff; padding-top: 150px; }
.top-fixed-bar { position: fixed; top: 0; left: 0; width: 100%; height: 150px; background: #0b0b0e; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
.top-bar-left { display: flex; align-items: center; gap: 16px; }
.top-bar-image { width: 96px; height: 96px; border-radius: 10px; object-fit: contain; }
.top-bar-title { font-family: 'Minecraft', monospace; font-weight: normal; font-size: 45px; color: #fff; letter-spacing: 1px; }

.container { position: relative; z-index: 1; width: 1100px; max-width: 100%; min-height: calc(100vh - 150px); background: #131318; padding: 0; padding-bottom: 20px; border-radius: 14px 14px 0 0; border: none; margin: 0 auto; overflow: visible; }
.tab-bar { display: flex; width: 100%; height: 52px; margin: 0; background: #0b0b0e; border-bottom: none; border-radius: 14px 14px 0 0; overflow: hidden; }
.tab-button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: #8b8b96; background: #1c1c22; border: none; margin-right: 3px; transition: background 0.15s, color 0.15s; user-select: none; font-size: 15px; font-weight: 700; letter-spacing: 0.4px; font-family: Arial, sans-serif; border-radius: 8px 8px 0 0; }
.tab-button:last-child { margin-right: 0; border-top-right-radius: 14px; }
.tab-button:first-child { border-top-left-radius: 14px; }
.tab-button:hover { background: #22222a; color: #c9c9d1; }
.tab-button.active { background: #131318; color: #fff; }
.tab-button.active span.tab-label { color: #fff; }
.tab-button img { width: 28px !important; height: 28px !important; }
.tab-button img, .mini-tier-circle img, .tier-icon-circle img { image-rendering: pixelated; }
.tab-label { font-size: 17.6px; font-weight: 700; letter-spacing: 0.4px; white-space: nowrap; }

.top-bar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin: 14px 20px; }

.info-btn-wrapper { position: relative; }
.info-btn { display: flex; align-items: center; gap: 7px; background: #1c1c22; border: 1px solid #2c2c34; color: #c9c9d1; padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.info-btn:hover { background: #26262e; }
.info-icon { width: 16px; height: 16px; border-radius: 50%; background: #3a3a44; color: #fff; font-size: 11px; font-weight: 800; font-style: italic; display: flex; align-items: center; justify-content: center; }
.info-tooltip { position: absolute; top: calc(100% + 8px); right: 0; background: #191920; border: 1px solid #2c2c34; border-radius: 10px; padding: 12px 16px; min-width: 180px; display: none; z-index: 50; }
.info-tooltip.active { display: block; }
.info-tooltip.overall-tooltip { min-width: 336px; padding: 14px 14px 10px; }
.tooltip-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tooltip-tab { flex: 1; text-align: center; padding: 9px 0; background: #22222a; border-radius: 8px; color: #8b8b96; font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; transition: background 0.15s, color 0.15s; }
.tooltip-tab:hover { background: #2a2a33; color: #c9c9d1; }
.tooltip-tab.active { background: #34343f; color: #fff; }
.tooltip-content.hidden { display: none; }
.info-row { padding: 9px 6px; }
.info-row + .info-row { border-top: 1px solid #25252d; }
.title-row { display: flex; flex-direction: column; gap: 3px; }
.title-word { font-size: 16px; font-weight: 800; font-family: 'Bahnschrift', sans-serif; align-self: flex-start; }
.info-desc { font-size: 12px; font-weight: 600; color: #8b8b96; }
.points-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.points-label { font-size: 15px; font-weight: 800; }
.search-btn-wrapper { position: relative; }
.search-btn { display: flex; align-items: center; gap: 7px; background: #1c1c22; border: 1px solid #2c2c34; color: #c9c9d1; padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
.search-btn:hover { background: #26262e; }
.search-btn svg { width: 14px; height: 14px; stroke: currentColor; }
.search-panel { position: absolute; top: calc(100% + 8px); right: 0; background: #191920; border: 1px solid #2c2c34; border-radius: 10px; padding: 14px; width: 250px; display: none; z-index: 70; }
.search-panel.active { display: block; }
.search-input { width: 100%; background: #131318; border: 1px solid #2c2c34; border-radius: 7px; color: #fff; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
.search-results { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.search-result-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; }
.search-result-item:hover { background: #22222a; }
.search-result-item img { width: 26px; height: 26px; border-radius: 5px; }
.search-empty { color: #5c5c66; font-size: 12px; padding: 6px 2px; }

.overall-headers { display: flex; align-items: center; margin: 10px 20px 0 20px; padding: 0 20px; font-size: 12px; font-weight: 600; color: #6b6b7a; text-transform: uppercase; letter-spacing: 0.5px; }
.overall-headers .header-position { width: 150px; padding-left: 20px; }
.overall-headers .header-player { flex: 1; padding-left: 20px; }
.overall-headers .header-tiers { width: 150px; text-align: right; padding-right: 26px; }

.player { display: flex; align-items: stretch; background: #191920; border-radius: 12px; margin: 14px 20px; overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, background 0.15s; min-height: 99px; }
.player:hover { transform: scale(1.035); box-shadow: 0 6px 16px rgba(0,0,0,0.45); background: #272731; }
.rank-flag { position: relative; display: flex; align-items: center; gap: 16px; padding: 18px 32px 18px 20px; background: #22222a; clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%); min-width: 150px; }
.rank-flag::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.15s; pointer-events: none; }
.player:hover .rank-flag::after { background: rgba(255,255,255,0.14); }
.rank-num { position: relative; z-index: 1; font-size: 32px; font-weight: 700; font-style: italic; color: #c7c7ce; width: 32px; }
.avatar { position: relative; z-index: 1; width: 60px; height: 60px; border-radius: 8px; background: #000; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #666; flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; image-rendering: pixelated; }
.info { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; gap: 12px; }
.player-name { font-size: 26px; font-weight: 700; letter-spacing: 0.3px; font-family: 'Bahnschrift', sans-serif; }
.player-title-row { display: flex; align-items: center; gap: 10px; }
.player-title-badge { background: #191920; border: 1px solid #2c2c34; border-radius: 6px; padding: 4px 14px; display: flex; align-items: center; height: 32px; }
.player-title-text { font-size: 16px; font-weight: 900; font-family: 'Bahnschrift', sans-serif; letter-spacing: 0.3px; white-space: nowrap; background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.player-points { font-size: 16px; font-weight: 600; color: #8b8b96; white-space: nowrap; }
.elo-wrap { display: flex; align-items: center; gap: 14px; padding: 0 26px; }
.mini-tiers-row { display: flex; align-items: center; gap: 18px; }
.mini-tier-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; cursor: default; }
.mini-tier-circle { width: 36px; height: 36px; border-radius: 50%; background: #131318; display: flex; align-items: center; justify-content: center; border: 2px solid #454b54; overflow: hidden; }
.mini-tier-circle img { width: 24px; height: 24px; }
.mini-tier-label { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 4px; background: #1a1a22; border: 1px solid #454b54; color: #8b8b96; letter-spacing: 0.3px; text-align: center; width: 40px; }
.global-mini-tip { position: fixed; background: #0e0e12; border: 1px solid #2c2c34; border-radius: 9px; padding: 8px 16px; font-size: 18px; font-weight: 700; display: none; z-index: 1000; pointer-events: none; transform: translate(-50%, -100%); text-align: center; line-height: 1.4; white-space: normal; }
.global-mini-tip .tip-tier { font-size: 18px; font-weight: 800; display: block; }
.global-mini-tip .tip-peak { font-size: 15px; font-weight: 800; display: block; margin-bottom: 2px; color: #fff; }
.global-mini-tip .tip-points { font-size: 13px; font-weight: 600; color: #8b8b96; margin-top: 4px; }

.tier-columns { display: flex; flex-wrap: nowrap; gap: 5px; justify-content: flex-start; margin: 8px 20px; overflow-x: auto; padding-bottom: 8px; }
.tier-column:first-child { margin-left: auto; }
.tier-column:last-child { margin-right: auto; }
.tier-column { flex: 0 0 230px; min-width: 230px; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; background: #14141a; }
.tier-column-1 { background: #2a2a1a; } .tier-column-2 { background: #2a2a30; } .tier-column-3 { background: #2a221a; } .tier-column-4 { background: #22222a; } .tier-column-5 { background: #22222a; }
.tier-header { text-align: center; font-family: 'Minecraft', monospace; font-size: 18px; font-weight: normal; padding: 10px 4px; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
.tier-players { padding: 6px 4px; display: flex; flex-direction: column; gap: 3px; }
.tier-player { display: flex; align-items: center; gap: 8px; background: #16161e; border-radius: 6px; padding: 4px 8px; transition: background 0.2s; cursor: pointer; border: 1px solid transparent; }
.tier-player:hover { background: #2a2a36; }
.tier-player.plus { background: #1e1e2a; }
.tier-player.plus:hover { background: #3a3a4a; }
.tier-player .tier-avatar { width: 28px; height: 28px; border-radius: 5px; overflow: hidden; flex-shrink: 0; }
.tier-player .tier-avatar img { width: 100%; height: 100%; }
.tier-player .tier-name { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tier-player .tier-badge { font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 12px; background: #2a2a36; color: #a9b6ff; flex-shrink: 0; }
.tier-player .tier-badge.plus { background: #1a3a5a; color: #6bb6ff; border: 1px solid #4a8af4; }
.tier-player .tier-badge.lt { background: transparent; }

.rank-1 .rank-flag { background: #f4c744; } .rank-1 .rank-num { color: #3a2c00; }
.rank-2 .rank-flag { background: #d6d9dd; } .rank-2 .rank-num { color: #2b2e33; }
.rank-3 .rank-flag { background: #d98b45; } .rank-3 .rank-num { color: #3a2000; }

.toggle-btn { display: block; width: calc(100% - 40px); margin: 10px 20px; padding: 10px; background: #22222a; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
.toggle-btn:hover { background: #2e2e38; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.active { display: flex; }
.modal-box { background: #131318; border-radius: 16px; padding: 36px; width: 460px; max-width: 100%; max-height: 90vh; overflow-y: auto; position: relative; text-align: center; border: 1px solid #232329; }
.modal-close { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; background: #22222a; border: none; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: #2e2e38; }
.modal-avatar { width: 110px; height: 110px; border-radius: 16px; background: #000; margin: 6px auto 16px; overflow: hidden; border: 2px solid #2a2a32; }
.modal-avatar img { width: 100%; height: 100%; }
.modal-name { font-family: 'Bahnschrift', sans-serif; font-size: 26px; font-weight: 700; margin-bottom: 16px; }
.role-badge { position: absolute; top: 16px; left: 16px; padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }
.role-player { color: #c9c9d1; border: 1px solid #5a5a64; background: #202024; }
.role-developer { color: #ff5c5c; border: 1px solid #7a2323; background: #241414; }
.role-owner { color: #5be6e6; border: 1px solid #1f6b70; background: #132628; }
.title-section { display: flex; justify-content: center; margin: 2px 0 28px; position: relative; }
.title-text-box { background: #191920; border: 1px solid #2c2c34; border-radius: 10px; height: 46px; display: flex; align-items: center; padding: 0 20px; }
.title-badge-text { font-size: 19px; font-weight: 900; font-family: 'Bahnschrift', sans-serif; letter-spacing: 0.4px; white-space: nowrap; }
.title-grad { background-clip: text; -webkit-background-clip: text; color: transparent; -webkit-text-fill-color: transparent; font-weight: 800; }
.title-tooltip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #0e0e12; border: 1px solid #2c2c34; border-radius: 8px; padding: 6px 14px; font-size: 14px; font-weight: 700; color: #a9b6ff; white-space: nowrap; display: none; }
.title-section:hover .title-tooltip { display: block; }
.modal-section-label { text-align: left; color: #8b8b96; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
.position-card { display: flex; align-items: stretch; background: #191920; border-radius: 10px; overflow: hidden; margin-bottom: 22px; }
.position-card .rank-flag { min-width: 70px; padding: 12px 22px 12px 14px; }
.position-card .pos-info { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 700; font-size: 15px; }
.pos-overall { color: #fff; font-size: 20px; font-weight: 800; }
.pos-points { color: #8b8b96; font-size: 15px; font-weight: 600; }
.tiers-row { display: flex; gap: 16px; justify-content: flex-start; flex-wrap: wrap; margin-bottom: 6px; }
.tier-icon-wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; }
.tier-icon-circle { width: 54px; height: 54px; border-radius: 50%; background: #191920; display: flex; align-items: center; justify-content: center; border: 3px solid #454b54; overflow: hidden; }
.tier-icon-circle img { width: 32px; height: 32px; }
.tier-icon-label { font-size: 12px; font-weight: 800; letter-spacing: 0.4px; }
.tier-elo-tip { position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); background: #0e0e12; border: 1px solid #2c2c34; border-radius: 9px; padding: 5px 12px; font-size: 18px; font-weight: 700; white-space: nowrap; display: none; z-index: 10; box-shadow: 0 6px 14px rgba(0,0,0,0.5); pointer-events: none; text-align: center; line-height: 1.4; }
.tier-elo-tip .tip-tier { font-size: 18px; font-weight: 800; display: block; }
.tier-elo-tip .tip-peak { font-size: 15px; font-weight: 800; display: block; margin-bottom: 2px; color: #fff; }
.tier-elo-tip .tip-points { font-size: 13px; font-weight: 600; color: #8b8b96; margin-top: 4px; }
.tier-icon-wrap:hover .tier-elo-tip { display: block; }

/* ---------- Minecraft-style inventory ---------- */
.mc-inv { width: 520px; max-width: calc(100% - 40px); margin: 30px auto 10px; background: #c6c6c6; padding: 14px 16px 16px; border: 4px solid; border-color: #fff #555 #555 #fff; outline: 2px solid #000; font-family: 'Minecraft', monospace; image-rendering: pixelated; }
.mc-inv-title { color: #404040; font-size: 18px; margin: 0 0 8px 2px; }
.mc-grid { display: grid; grid-template-columns: repeat(9, 1fr); }
.mc-hotbar { display: grid; grid-template-columns: repeat(9, 1fr); margin-top: 10px; }
.mc-slot { position: relative; aspect-ratio: 1 / 1; background: #8b8b8b; border: 2px solid; border-color: #373737 #fff #fff #373737; display: flex; align-items: center; justify-content: center; cursor: default; }
.mc-slot img.mc-icon { width: 80%; height: 80%; image-rendering: pixelated; object-fit: contain; pointer-events: none; }
.mc-fallback { width: 70%; height: 70%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; border: 2px solid rgba(0,0,0,0.45); pointer-events: none; }
.mc-count { position: absolute; right: 2px; bottom: 0; color: #fff; font-size: 16px; text-shadow: 2px 2px 0 #3f3f3f; pointer-events: none; }
.mc-slot:hover::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0.5); pointer-events: none; }
.mc-tip { position: fixed; z-index: 2000; display: none; pointer-events: none; background: rgba(16,0,16,0.94); border: 2px solid #25005c; box-shadow: inset 0 0 0 1px #5000a0, 0 0 0 2px rgba(16,0,16,0.94); padding: 6px 8px; font-family: 'Minecraft', monospace; font-size: 16px; line-height: 1.35; white-space: nowrap; text-shadow: 2px 2px 0 #3f3f3f; image-rendering: pixelated; }

.discord-btn { display: inline-flex; align-items: center; gap: 9px; margin-left: auto; flex-shrink: 0; padding: 10px 20px; background: #5865F2; color: #fff; border-radius: 999px; text-decoration: none; font-family: 'gg sans', 'Noto Sans', 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 17px; transition: background 0.15s; }
.discord-btn:hover { background: #4752C4; }
.discord-btn svg { width: 24px; height: 24px; flex-shrink: 0; }
.kit-pane { width: 100%; }
.kit-header { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 4px 0 6px; }
.kit-header img { width: 44px; height: 44px; image-rendering: pixelated; }
.kit-header span { font-family: 'Bahnschrift', sans-serif; font-size: 30px; font-weight: 700; }
.kit-sub { font-size: 14px; color: #fff; margin-bottom: 18px; }
.mc-inv { width: 100%; max-width: none; margin: 0; }
.mc-row { display: grid; grid-template-columns: repeat(9, 1fr); }
.mc-inv-title { margin: 10px 0 6px 2px; text-align: left; }
.mc-glint { position: absolute; inset: 10%; pointer-events: none; overflow: hidden; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; image-rendering: pixelated; mix-blend-mode: screen; }
/* glint: purple diagonal gradient, colour-dodge blended, clipped to the item's shape */
.mc-glint { background: linear-gradient(135deg, rgba(128,0,128,0) 0%, rgba(140,40,230,0.6) 25%, rgba(200,100,255,0.9) 50%, rgba(140,40,230,0.6) 75%, rgba(128,0,128,0) 100%); background-size: 200% 200%; mix-blend-mode: color-dodge; animation: glint-move 3s linear infinite; }
@keyframes glint-move { 0% { background-position: 200% 0%; } 100% { background-position: -200% 0%; } }
@media (prefers-reduced-motion: reduce) { .mc-glint { animation: none; } }

/* ---------- Kit display: Minecraft font everywhere + equipment/player model area ---------- */
.kit-pane, .kit-pane *, .mc-inv, .mc-inv *, .mc-tip, .mc-tip * { font-family: 'Minecraft', monospace !important; font-synthesis: none; }
.kit-pane button, .mc-count, .mc-fallback { font-family: 'Minecraft', monospace !important; }
.kit-header span { font-family: 'Bahnschrift', sans-serif !important; }
.kit-sub { font-family: Arial, sans-serif !important; }
.mc-equip { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(4, auto); margin-bottom: 4px; }

/* ---------- Phones ---------- */
@media (max-width: 700px) {
  body { padding-top: 80px; }
  .top-fixed-bar { height: 80px; padding: 0 14px; }
  .top-bar-left { gap: 10px; }
  .top-bar-image { width: 48px; height: 48px; }
  .top-bar-title { font-size: 22px; letter-spacing: 0; }
  .discord-btn { margin-left: auto; padding: 7px 12px; font-size: 14px; gap: 6px; }
  .discord-btn svg { width: 18px; height: 18px; }

  .container { border-radius: 0; min-height: calc(100vh - 80px); }
  .tab-bar { height: 46px; border-radius: 0; }
  .tab-button, .tab-button:first-child, .tab-button:last-child { border-radius: 8px 8px 0 0; gap: 5px; }
  .tab-button img { width: 22px !important; height: 22px !important; }
  .tab-label { font-size: 13px; }

  .top-bar { position: relative; margin: 10px 12px; flex-wrap: wrap; gap: 8px; }
  .info-btn-wrapper, .search-btn-wrapper { position: static; }
  .info-tooltip, .search-panel { left: 0; right: 0; width: auto; }
  .info-tooltip.overall-tooltip { min-width: 0; }
  .info-btn, .search-btn { padding: 7px 13px; }

  .overall-headers { display: none !important; }
  .player { flex-wrap: wrap; margin: 10px 12px; min-height: 0; }
  .player:hover { transform: none; box-shadow: none; }
  .rank-flag { min-width: 96px; padding: 10px 24px 10px 12px; gap: 8px; }
  .rank-num { font-size: 22px; width: 28px; }
  .avatar { width: 44px; height: 44px; }

/* ---------- Round 3 tweaks ---------- */
/* Page gradient reaches the full width and sits behind the top bar too */
body { background: radial-gradient(ellipse 110% 560px at 50% 0, #2a1418 0%, rgba(11,11,14,0) 100%) no-repeat, #0b0b0e; padding-top: 0; }
.top-fixed-bar { position: relative; background: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-bottom: none; }

/* Selected tab matches the container background */
.tab-button.active { background: #16161e; box-shadow: none; }

/* Ranking numbers: bold italic sans-serif */
.rank-num { font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif !important; font-weight: 800; font-style: italic; color: #fff !important; text-shadow: 2px 2px 0 #000; }

/* Top 3: moving shine across the static colour */
.rank-1 .rank-flag::before, .rank-2 .rank-flag::before, .rank-3 .rank-flag::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 100%; background: linear-gradient(105deg, rgba(255,255,255,0) 35%, rgba(255,255,255,0.7) 50%, rgba(255,255,255,0) 65%); transform: translateX(-130%); animation: rankShine 3s ease-in-out infinite; pointer-events: none; }
@keyframes rankShine { 0% { transform: translateX(-130%); } 45% { transform: translateX(130%); } 100% { transform: translateX(130%); } }
@media (prefers-reduced-motion: reduce) {
  .rank-1 .rank-flag::before, .rank-2 .rank-flag::before, .rank-3 .rank-flag::before { animation: none; display: none; }
}

/* Title bars load in and ease to a stop; tier columns open downward and are only as tall as their content */
.ti-fill { width: 0; transition: width 2.3s cubic-bezier(0.1, 0.75, 0.2, 1); }
.in-view .ti-fill { width: var(--w); }
.tier-columns { align-items: flex-start; }
.tier-column.open { animation: colOpen 0.7s cubic-bezier(0.3, 0.7, 0.2, 1) backwards; }
@keyframes colOpen { from { clip-path: inset(0 0 100% 0 round 10px); } to { clip-path: inset(0 0 0 0 round 10px); } }
@media (prefers-reduced-motion: reduce) { .ti-fill { transition: none; } .tier-column.open { animation: none; } }

/* Overall rows grow in from nothing, staggered down the list */
.player.pop { animation: playerPop 0.45s cubic-bezier(0.2, 0.8, 0.3, 1) backwards; }
@keyframes playerPop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .player.pop { animation: none; } }

/* Profile glow: colour = title colour, size grows with the title (--gs). Novice / Cadet have none.
   Four side glows push out and pull back with staggered timing, so a slow wave travels around the box. */
@property --w1 { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --w2 { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --w3 { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --w4 { syntax: '<number>'; inherits: true; initial-value: 0; }
.modal-box {
  --gs: 30px; --glow: transparent;
  box-shadow:
    0 calc(var(--gs) * -0.4 * var(--w1)) var(--gs) 0 var(--glow),
    calc(var(--gs) * 0.4 * var(--w2)) 0 var(--gs) 0 var(--glow),
    0 calc(var(--gs) * 0.4 * var(--w3)) var(--gs) 0 var(--glow),
    calc(var(--gs) * -0.4 * var(--w4)) 0 var(--gs) 0 var(--glow);
  animation: glowW1 7s ease-in-out infinite alternate, glowW2 7s ease-in-out -3.5s infinite alternate, glowW3 7s ease-in-out -7s infinite alternate, glowW4 7s ease-in-out -10.5s infinite alternate;
}
.modal-box.no-glow { box-shadow: none; animation: none; }
@keyframes glowW1 { from { --w1: 0; } to { --w1: 1; } }
@keyframes glowW2 { from { --w2: 0; } to { --w2: 1; } }
@keyframes glowW3 { from { --w3: 0; } to { --w3: 1; } }
@keyframes glowW4 { from { --w4: 0; } to { --w4: 1; } }
@media (prefers-reduced-motion: reduce) { .modal-box { animation: none; } }

.global-mini-tip, .tier-elo-tip { transform-origin: 50% 100%; animation: tipIn 0.15s ease; }

// Internal keys: "1+" = HT1, "1" = LT1, ... "5" = LT5
const TIER_POINTS = { "1+": 1000, "1": 750, "2+": 500, "2": 350, "3+": 200, "3": 125, "4+": 75, "4": 50, "5+": 25, "5": 15 };
const TIER_COLORS = { "1+": "#E8BA3A", "1": "#D5B355", "2+": "#C4D3E7", "2": "#A0A7B2", "3+": "#F89F5A", "3": "#C67B42", "4+": "#81749a", "4": "#655B79", "5+": "#81749a", "5": "#655B79" };

const tierKey = (t, plus) => plus ? `${t}+` : `${t}`;
function shortTierLabel(t, plus) { return `${plus ? 'HT' : 'LT'}${t}`; }
function fullTierLabel(t, plus) { return shortTierLabel(t, plus); }
function peakTierLabel(t, plus) { return `Peak ${shortTierLabel(t, plus)}`; }

function isPeakBetter(cT, cP, pT, pP) {
  if (pT == null || cT == null) return false;
  return TIER_ORDER[tierKey(pT, pP)] < TIER_ORDER[tierKey(cT, cP)];
}

// Peak (if better) on top, then current tier, then points. Tier text is white.
function generateTierTooltipHTML(mode, cT, cP, pT, pP) {
  const ck = tierKey(cT, cP);
  let html = "";
  if (pT != null && isPeakBetter(cT, cP, pT, pP)) {
    html += `<div class="tip-peak">${peakTierLabel(pT, pP)}</div>`;
  }
  html += `<div class="tip-tier" style="color:${TIER_COLORS[ck] || '#fff'}">${fullTierLabel(cT, cP)}</div>`;
  return html + `<div class="tip-points">(${TIER_POINTS[ck] || 0} points)</div>`;
}

// HT = plus, LT = no plus
function recomputePlus() {
  allPlayers.forEach(p => SUB_BOARDS.forEach(m => { p[`_computed_plus_${m}`] = p[`${m}_tier`] != null && p[`${m}_plus`]; }));
}

function computePlayerPoints(player) {
  let total = 0;
  LIVE_BOARDS.forEach(key => {
    const tier = player[`${key}_tier`];
    if (tier != null && tier >= 1 && tier <= 5) total += TIER_POINTS[tierKey(tier, player[`_computed_plus_${key}`])] || 0;
  });
  return total;
}

// Point requirement = base x number of gamemodes, with a trailing 50 dropped (1950 -> 1900)
const cleanReq = v => (v % 100 === 50 && v > 50) ? v - 50 : v;
const TITLE_BASE = { Legend: 750, Grandmaster: 650, Master: 500, Champion: 300, Expert: 150, Cadet: 50 };
const TITLE_MIN = {};
Object.keys(TITLE_BASE).forEach(k => { const v = TITLE_BASE[k] * NUM_MODES; TITLE_MIN[k] = k === 'Cadet' ? v : cleanReq(v); }); // Cadet keeps its exact number

function getPlayerTitle(points) {
  if (!points) return null;
  for (const k of Object.keys(TITLE_BASE)) if (points >= TITLE_MIN[k]) return k;
  return "Novice";
}

};

// ---------- Routing ----------
const hist = (m, u) => { try { history[m](null, '', u); } catch (e) {} };
function parseRoute() {
  const p = window.location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let board = 'Home', profile = null;
  if (p[0] === 'player' && p[1]) profile = decodeURIComponent(p[1]);
  else if (p[0]) { const seg = p[0].toLowerCase() === 'lowblock' ? 'triathlon' : p[0].toLowerCase(); const k = Object.keys(LEADERBOARDS).find(k => k.toLowerCase() === seg); if (k) board = k; }
  const kit = board === 'NeliSMP' && !profile && p[1] === 'kit';
  return { board, profile, kit };
}
function navigateTo(board, profileName) {
  const newHash = profileName ? `#/player/${encodeURIComponent(profileName)}` : `#/${board.toLowerCase()}`;

}
function openRouteProfile() {
  const player = allPlayers.find(p => p.name.toLowerCase() === currentProfileName.toLowerCase());

}
function handleRoute() {

function tierEntries(player) {
  const entries = LIVE_BOARDS.map(key => ({
    tier: player[`${key}_tier`], plus: player[`_computed_plus_${key}`],
    peakTier: player[`${key}_peak_tier`] ?? null, peakPlus: player[`${key}_peak_plus`] ?? false,
    board: LEADERBOARDS[key], mode: key
  }));
  const k = e => e.tier != null ? tierKey(e.tier, e.plus) : "none";
  return entries.sort((a, b) => TIER_ORDER[k(a)] - TIER_ORDER[k(b)]);
}

const TIER_COL_BG = { 1: '#2a2a1a', 2: '#2a2a30', 3: '#2a221a', 4: '#22222a', 5: '#22222a' };
function renderMiniTierIcons(player) {
  let html = "";
  tierEntries(player).forEach(({ tier, plus, board, peakTier, peakPlus, mode }) => {
    if (tier != null && tier >= 1 && tier <= 5) {
      const color = TIER_COLORS[tierKey(tier, plus)];
      html += `
        <div class="mini-tier-wrap" data-mode="${mode}" data-current-tier="${tier}" data-current-plus="${plus ? '1' : '0'}" data-peak-tier="${peakTier ?? ''}" data-peak-plus="${peakPlus ? '1' : '0'}">
          <div class="mini-tier-circle" style="border-color:${color}"><img src="${board.icon}" alt="${board.label}"></div>
          <div class="mini-tier-label" style="border-color:${color}; color:${color}; background:${TIER_COL_BG[tier]};">${shortTierLabel(tier, plus)}</div>
        </div>`;
    } else {
      html += `
        <div class="mini-tier-wrap no-tier" data-mode="${mode}" data-current-tier="" data-current-plus="" data-peak-tier="" data-peak-plus="">
          <div class="mini-tier-circle"><img src="${board.icon}" alt="${board.label}"></div>
          <div class="mini-tier-label">-</div>
        </div>`;
    }
  });
  return html;
}

const globalMiniTip = document.getElementById("globalMiniTip");
const isTouch = () => window.matchMedia("(hover: none)").matches;
let lastTipWrap = null;
function showMiniTip(wrap) {
  if (lastTipWrap !== wrap || globalMiniTip.style.display !== "block") { globalMiniTip.style.animation = "none"; void globalMiniTip.offsetWidth; globalMiniTip.style.animation = ""; }
  lastTipWrap = wrap;
  const cT = parseInt(wrap.dataset.currentTier);
  globalMiniTip.innerHTML = isNaN(cT)
    ? `<div class="tip-tier">No Tier</div>`
    : generateTierTooltipHTML(wrap.dataset.mode, cT, wrap.dataset.currentPlus === '1', wrap.dataset.peakTier ? parseInt(wrap.dataset.peakTier) : null, wrap.dataset.peakPlus === '1');
  globalMiniTip.style.display = "block";
  const rect = wrap.getBoundingClientRect();
  globalMiniTip.style.left = (rect.left + rect.width / 2) + "px";
  globalMiniTip.style.top = (rect.top - 8) + "px";
}
const hideMiniTip = () => { globalMiniTip.style.display = "none"; lastTipWrap = null; };
[list, topPlayersEl].forEach(el => {
  el.addEventListener("mouseover", (e) => {
    const wrap = e.target.closest(".mini-tier-wrap");
    if (wrap) showMiniTip(wrap);
  });
  el.addEventListener("mouseout", (e) => {
    if (!e.target.closest(".mini-tier-wrap")?.contains(e.relatedTarget)) hideMiniTip();
  });
});
document.addEventListener("click", (e) => { if (!e.target.closest(".mini-tier-wrap")) hideMiniTip(); });
document.addEventListener("scroll", hideMiniTip, true);

// Players with equal points share a position (1, 1, 3, ...)
function assignRanks(sorted) {
  sorted.forEach((p, i) => { p.__rank = (i > 0 && p.__points === sorted[i - 1].__points) ? sorted[i - 1].__rank : i + 1; });
  return sorted;
}

// EDIT THE KIT HERE.
//  slot:  2-5 = armour (helmet, chestplate, leggings, boots), 6 = offhand, 9-35 = main inventory, 36-44 = hotbar
//  icon:  key from ICONS above (official Minecraft sprites)
//  rarity: "common" | "uncommon" | "rare" | "epic"  (enchanted common items automatically turn aqua like in-game)

//  glint: true = purple glint without enchant lines (e.g. Bottle o' Enchanting)
//  lore: extra lines (Minecraft colour codes work: &0-&9 &a-&f, &l bold, &o italic, &r reset)

const MC_COLORS = { 0:'#000000',1:'#0000AA',2:'#00AA00',3:'#00AAAA',4:'#AA0000',5:'#AA00AA',6:'#FFAA00',7:'#AAAAAA',8:'#555555',9:'#5555FF',a:'#55FF55',b:'#55FFFF',c:'#FF5555',d:'#FF55FF',e:'#FFFF55',f:'#FFFFFF' };
const RARITY_COLORS = { common: '#FFFFFF', uncommon: '#FFFF55', rare: '#55FFFF', epic: '#FF55FF' };
const escHtml = ch => ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
const isEnchanted = it => !!(it.enchants && it.enchants.length);

function mcText(str, base) {
  let color = base, bold = false, italic = false, out = '', buf = '';
  const flush = () => { if (buf) { out += `<span style="color:${color};${bold ? 'font-weight:bold;' : ''}${italic ? 'font-style:italic;' : ''}">${buf}</span>`; buf = ''; } };
  for (let i = 0; i < str.length; i++) {
    if (str[i] === '&' && i + 1 < str.length && /[0-9a-flor]/i.test(str[i + 1])) {
      flush();
      const c = str[++i].toLowerCase();
      if (MC_COLORS[c]) { color = MC_COLORS[c]; bold = false; italic = false; }
      else if (c === 'l') bold = true;
      else if (c === 'o') italic = true;
      else if (c === 'r') { color = base; bold = false; italic = false; }
    } else buf += escHtml(str[i]);
  }
  flush();
  return out || '&nbsp;';
}

// Name colour: rarity colour; enchanted common items turn aqua (like in-game); enchanted uncommon stays as-is.
function itemNameColor(it) {
  const r = it.rarity || 'common';
  if (r === 'common' && isEnchanted(it)) return RARITY_COLORS.rare;
  return RARITY_COLORS[r] || '#FFFFFF';
}

function itemTooltipHTML(it) {
  let html = `<div>${mcText(it.name, itemNameColor(it))}</div>`;
  if (isEnchanted(it)) it.enchants.forEach(e => { html += `<div>${mcText(e, '#AAAAAA')}</div>`; });
  (it.lore || []).forEach(l => { html += `<div>${l === '' ? '&nbsp;' : mcText(l, '#AA00AA')}</div>`; });
  if (it.attributes && it.attributes.length) {
    html += `<div>&nbsp;</div>`;
    if (it.slotLabel) html += `<div>${mcText(it.slotLabel, '#AAAAAA')}</div>`;
    it.attributes.forEach(a => { html += `<div>${mcText(a.startsWith('&') ? a : ' ' + a, '#5555FF')}</div>`; });
  }
  return html;
}

function moveMcTip(e) {
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY - 30;
  const w = mcTip.offsetWidth, h = mcTip.offsetHeight;
  if (x + w > window.innerWidth - 4) x = e.clientX - w - pad;
  if (y + h > window.innerHeight - 4) y = window.innerHeight - h - 4;
  if (y < 4) y = 4;

// 16px sprites only look clean at whole-number scales, so the icon box snaps to a multiple of 16px
function snapKitIcons(root) {
  const inv = root.querySelector('.mc-inv'); if (!inv) return;
  const avail = (inv.parentElement ? inv.parentElement.clientWidth : 0) || 528;
  const sc = avail >= 176 ? Math.floor(avail / 176) : avail / 176;
  inv.style.setProperty('--s', Math.max(sc, 1) + 'px');

// hi-res nearest-neighbour copy of a sprite, used as the glint mask so its edges stay sharp
const upCache = {};
function upscaleSprite(src, f = 16) {
  return upCache[src] || (upCache[src] = new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = im.naturalWidth * f; c.height = im.naturalHeight * f;
        const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL());
      } catch (e) { res(src); }
    };
    im.onerror = () => res(src); im.src = src;
  }));
}
// Sprites are redrawn onto a canvas at a whole-number scale (nearest neighbour) and nearly transparent edge pixels are dropped, which removes the faint fringes
const cleanCache = {};
function cleanSprite(src, f = 8) {
  return cleanCache[src] || (cleanCache[src] = new Promise(res => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const w = im.naturalWidth, h = im.naturalHeight;
        const a = document.createElement('canvas'); a.width = w; a.height = h;
        const ax = a.getContext('2d', { willReadFrequently: true }); ax.imageSmoothingEnabled = false; ax.drawImage(im, 0, 0);
        const d = ax.getImageData(0, 0, w, h), p = d.data;
        for (let i = 0; i < p.length; i += 4) { if (p[i + 3] < 40) { p[i] = p[i + 1] = p[i + 2] = p[i + 3] = 0; } }
        ax.putImageData(d, 0, 0);
        const c = document.createElement('canvas'); c.width = w * f; c.height = h * f;
        const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(a, 0, 0, c.width, c.height);
        res(c.toDataURL());
      } catch (e) { res(src); }
    };

  }));
}
// tileable purple glint texture (stand-in for enchanted_glint_item.png), generated once
(function () {
  const S = 64, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d'), img = x.createImageData(S, S);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const g = []; for (let i = 0; i < 64; i++) g.push(rnd());
  const cell = (u, v) => g[((u & 7) * 8 + (v & 7))];
  for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
    const w = Math.sin(2 * Math.PI * (px * 2 + py) / S) + Math.sin(2 * Math.PI * (px - py * 3) / S) * 0.7;
    const v = (w + 1.7) / 3.4 * 0.7 + cell(px >> 3, py >> 3) * 0.3;
    const a = Math.max(0, Math.min(1, (v - 0.42) * 3.2));
    const i = (py * S + px) * 4;
    img.data[i] = 150 + a * 70; img.data[i + 1] = 70 + a * 60; img.data[i + 2] = 255; img.data[i + 3] = a * 255;
  }
  x.putImageData(img, 0, 0);
  document.documentElement.style.setProperty('--glint-tex', `url(${c.toDataURL()})`);
})();
function renderInventory(container, items = KIT_ITEMS) {
  const bySlot = {};
  items.forEach(it => { bySlot[it.slot] = it; });
  // positions (in texture pixels) of every slot in the 176x166 inventory image
  const slotPos = i => {
    if (i >= 2 && i <= 5) return [8, 8 + (i - 2) * 18];
    if (i === 6) return [77, 62];
    if (i >= 9 && i <= 35) return [8 + ((i - 9) % 9) * 18, 84 + Math.floor((i - 9) / 9) * 18];
    if (i >= 36 && i <= 44) return [8 + (i - 36) * 18, 142];
    return null;
  };
  const slotHtml = it => {
    const p = slotPos(it.slot); if (!p) return '';
    const src = ICONS[it.icon];
    const glint = ''; // enchantment glint is switched off on the kit page
    return `<div class="mc-slot" data-slot="${it.slot}" style="left:calc(var(--s) * ${p[0]});top:calc(var(--s) * ${p[1]})"><div class="mc-ibox"><img class="mc-icon" src="${src}" alt="">${glint}</div>${it.count > 1 ? `<span class="mc-count">${it.count}</span>` : ''}</div>`;

  if (invEl && window.ResizeObserver) new ResizeObserver(() => snapKitIcons(container)).observe(invEl);

    const it = bySlot[+el.dataset.slot];

    el.addEventListener('mouseenter', e => { mcTip.innerHTML = itemTooltipHTML(it); mcTip.style.display = 'block'; moveMcTip(e); });

    sorted.slice(0, visibleCount).forEach((p, i) => {

          : `<span class="tier-badge lt" title="LT${t}" style="color:${ltColor}; border:1px solid ${ltColor};">${CHEV_LT}</span>`;
        div.innerHTML = `

function parseTier(t) {
  const m = /^([HL])T([1-5])$/i.exec((t || '').trim());
  return m ? { tier: +m[2], plus: m[1].toUpperCase() === 'H' } : { tier: null, plus: false };
}
function mapPlayer(row) {
  const o = { id: row.id, name: row.player, regulator: !!row.tierlist_regulator, tester: {} };
  SUB_BOARDS.forEach(key => {
    const col = LEADERBOARDS[key].col;
    const cur = parseTier(row[`${col}_tier`]), peak = parseTier(row[`${col}_peaktier`]);
    o[`${key}_tier`] = cur.tier; o[`${key}_plus`] = cur.plus;
    o[`${key}_peak_tier`] = peak.tier; o[`${key}_peak_plus`] = peak.plus;
    o.tester[key] = !!row[`${col}_tester`];
  });
  return o;
}

let lastDataSig = '';
async function loadPlayersAndRender(force = true) {
  let rows;
  try {
    const get = async cols => {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/players?select=${cols}`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY }
      });
      const body = await res.json();
      if (!res.ok) throw new Error((body.code || res.status) + " " + (body.message || ""));
      return body;
    };
    // falls back to older column sets until the SQL migrations have been run
    let lastErr = null;
    outer: for (const sw of [true, false]) for (const van of [true, false]) {
      for (const [c, roles] of [['triathlon', true], ['triathlon', false], ['lowblockranked', true], ['lowblockranked', false]]) {
        const cols = `id,player,nelismp_tier,nelismp_peaktier,${c}_tier,${c}_peaktier` + (van ? ',vanilla_tier,vanilla_peaktier' : '') + (sw ? ',sword_tier,sword_peaktier' : '') + (roles ? `,tierlist_regulator,nelismp_tester,${c}_tester` + (van ? ',vanilla_tester' : '') + (sw ? ',sword_tester' : '') : '');
        try { rows = await get(cols); LEADERBOARDS.Triathlon.col = c; break outer; } catch (e) { lastErr = e; }
      }
    }
    if (!rows) throw lastErr;
  } catch (err) {
    console.error(err);
    list.innerHTML = `<div style="padding:30px;text-align:center;color:#ff6b6b;">Error loading data<br><small style="color:#8b8b96">${err.message}</small></div>`;
    return;
  }
  const sig = JSON.stringify(rows);
  if (!force && sig === lastDataSig) return;
  lastDataSig = sig;
  allPlayers = rows.filter(r => r.player).map(mapPlayer);
  recomputePlus();
  render();
  try { accOnPlayersLoaded(); } catch (e) {}
}

// ----- tier test logic: which test, which opponents -----
function accPlayerKey(kit, name) {
  const me = allPlayers.find(p => p.name.toLowerCase() === name.toLowerCase());
  const t = me?.[`${kit}_tier`];
  return t != null ? tierKey(t, !!me[`${kit}_plus`]) : null;
}
const EVAL_COOLDOWN_DAYS = 7, FAIL_COOLDOWN_DAYS = 14, PROMO_COOLDOWN_DAYS = 7; // PROMO: wait after a promotion that did NOT bridge
async function accLoadHistory() {
  const { data } = await sb.from('tier_requests').select('id,kit,test_type,status,resolved_at,result')
    .eq('user_id', accSession.user.id).in('status', ['passed', 'failed']).order('resolved_at', { ascending: false }).limit(40);
  return data || [];
}
// Cooldown / evaluation-passed / bridge state for one gamemode, from the player's last resolved test.
function accKitState(kit, hist, name) {
  const rows = hist.filter(r => r.kit === kit), last = rows[0];
  const st = { last, evalPassed: false, bridge: false, cooldownUntil: null, cooldownWhy: '', firstTime: rows.length === 0 && !accPlayerKey(kit, name) };
  if (!last) return st;
  const res = last.result || {}, isEval = last.test_type === 'Evaluation Test';
  let days = 0;
  if (last.status === 'failed') { days = isEval ? EVAL_COOLDOWN_DAYS : FAIL_COOLDOWN_DAYS; st.cooldownWhy = isEval ? 'You recently took an evaluation test.' : `You failed your last ${last.test_type}.`; }
  else if (res.eval_passed) st.evalPassed = true;
  else if (res.bridge) st.bridge = true;
  else { days = isEval ? EVAL_COOLDOWN_DAYS : PROMO_COOLDOWN_DAYS; st.cooldownWhy = isEval ? 'You recently took an evaluation test.' : `You were just promoted (${last.test_type}) without bridging.`; }
  if (days) { const until = new Date(last.resolved_at).getTime() + days * 864e5; if (until > Date.now()) st.cooldownUntil = new Date(until); }
  return st;
}
// LT3 and below (or unrated) -> Evaluation Test, unless the player passed evaluation (-> HT3 Test straight away).
// HT3 and above -> "<next tier up> Test". HT1 -> nothing above.
function accTestInfo(kit, name, st = {}) {
  const myKey = accPlayerKey(kit, name);
  if (!myKey || TIER_ORDER[myKey] >= TIER_ORDER['3']) {
    if (myKey === '3' && st.evalPassed) return { mode: 'promo', type: 'HT3 Test', myKey, targetKey: '3+', bridge: false };
    return { mode: 'eval', type: 'Evaluation Test', myKey };
  }
  if (myKey === '1+') return { mode: 'top', type: '', myKey };
  const targetKey = LADDER[LADDER.indexOf(myKey) - 1];
  return { mode: myKey === '1' ? 'ht1' : 'promo', type: keyLabel(targetKey) + ' Test', myKey, targetKey, bridge: !!st.bridge };
}
function accTierPlayers(kit, key, exclude) {
  return allPlayers.filter(p => p[`${kit}_tier`] != null && tierKey(p[`${kit}_tier`], !!p[`${kit}_plus`]) === key && p.name.toLowerCase() !== exclude.toLowerCase()).map(p => p.name);
}
// Sword: rounds the testee has to score against the higher tier opponent, and the match format per tier
const swordRoundsNeeded = key => key === '1+' ? 20 : key === '1' ? 17 : (key === '2+' || key === '2') ? 12 : key === '3+' ? 8 : 4;

function accAssign(kit, name, info, st = {}) {

  if (info.mode === 'eval') return { steps: [{ title: 'Face your tester, who will assign you a tier', opponents: [] }], meta };
  const own = accTierPlayers(kit, info.myKey, name), tgt = accTierPlayers(kit, info.targetKey, name);
  const steps = [];
  if (info.mode === 'ht1') {
    if (!meta.bridged) steps.push({ title: 'Defeat all current LT1 players', opponents: own, tier: info.myKey });
    if (tgt.length) steps.push({ title: 'Defeat the current HT1', opponents: tgt, tier: info.targetKey });
    if (!steps.length) steps.push({ title: 'Defeat all current LT1 players', opponents: own, tier: info.myKey });
    return { steps, meta };
  }
  if (!tgt.length) { steps.push({ title: `Defeat all other ${keyLabel(info.myKey)} players`, opponents: own, tier: info.myKey }); return { steps, meta }; }
  if (own.length && !meta.bridged) steps.push({ title: `Win against a ${keyLabel(info.myKey)} player`, opponents: [accPick(own)], tier: info.myKey });

}

function accRulesHtml(kit, info) {
  const S = gmSections(kit);
  let h = '<h3>Rules</h3>';
  const tn = info.myKey ? +info.myKey[0] : null;
  if (info.mode === 'eval') {
    h += S.eval(true);
  } else if (info.mode === 'promo' || info.mode === 'ht1') {
    const t2 = info.targetKey && +info.targetKey[0] <= 2;
    h += info.mode === 'promo' ? S.promo(info.type, t2, true) : S.ht1(true);
    const shift = info.mode === 'promo' ? accTierShift(kit, info.myKey) : null;
    if (shift) h += S.shift(shift, false);
    if (info.myKey === '3+' || (kit === 'Sword' && info.myKey === '3')) h += S.demoLow(false);
    else if (tn <= 2) h += S.demoDS(false);
    h += S.bridge(false) + S.forfeit(false) + S.fail(false);
  }
  h += S.items(false) + S.maps(false) + tierlistRulesHtml(false, kit);
  return svgify(`<div class="acc-rules">${h}</div>`);
}

    <p class="acc-p"><span class="gmv">Highlighted</span> rules are different in each gamemode.</p>
    <div class="acc-rules">${S.eval(false)}${S.promo('', false, false)}${S.ht1(false)}${S.shift(null, false)}${S.demoLow(false)}${S.demoDS(false)}${S.bridge(false)}${S.forfeit(false)}${S.fail(false)}${S.items(false)}${S.maps(false)}${tierlistRulesHtml(false, kit)}</div>`);
}

async function accLoadMine() {
  const since = new Date(Date.now() - 14 * 864e5).toISOString();
  const { data } = await sb.from('tier_requests').select('id,kit,test_type,status,requested_at,opponents,resolved_at')
    .eq('user_id', accSession.user.id).or(`status.eq.pending,and(status.eq.failed,resolved_at.gte.${since})`).order('requested_at');
  return data || [];
}

function accViewRegister() {
  accStopTimers();
  accOpen(`<h2>Register</h2>
    <input class="acc-in" id="aUser" placeholder="Minecraft Name" maxlength="16" autocomplete="off">
    <div class="acc-msg" id="aMsg"></div>
    <button class="acc-go" id="aGo" type="button">Continue</button>

      return accMsg('Something went wrong. Try again.');
    }
    accViewVerify(u, data);
  };
  accEl('aGo').onclick = go; onEnter(['aUser'], go);
  accEl('aSwitch').onclick = accViewLogin;
  accEl('aUser').focus();
}

function accViewVerify(user, code) {

function accViewPassword(user, code) {
  accOpen(`<h2>Create a password</h2>
    <p class="acc-p">Verified as <b>${accEsc(user)}</b>.</p>
    <input class="acc-in" id="aPass" type="password" placeholder="Password (min. 8 characters)" autocomplete="new-password">

// ----- views: tier tests -----

async function accViewTests() {
  accStopTimers();
  if (accSession && !accProfile) await accRefreshProfile();
  if (!accProfile) return accViewLogin();
  const name = accProfile.mc_username;
  const [hist, , mine0] = await Promise.all([accLoadHistory(), accQueuePoll(), accLoadMine()]);
  SUB_BOARDS.forEach(k => { const st0 = accKitState(k, hist, name), i0 = accTestInfo(k, name, st0); accQElig[k] = i0.mode === 'eval' && !st0.cooldownUntil && !(mine0 || []).some(r => r.kit === k && r.status === 'pending'); });
  accOpen(`<h2>Tier tests</h2>${accQBannerHtml()}
    <div class="tt-kits">${SUB_BOARDS.map(k => {
      const st = accKitState(k, hist, name), info = accTestInfo(k, name, st);
      const sub = info.mode === 'top' ? 'Top tier reached' : st.cooldownUntil ? 'Available ' + accDay(st.cooldownUntil) : info.type;
      return `<div class="tt-kit" data-kit="${k}"><button class="tt-i" type="button" data-info="${k}" aria-label="${accEsc(k)} kit">i</button>
        <img src="${LEADERBOARDS[k].icon}" alt=""><b>${accEsc(LEADERBOARDS[k].label)}</b><small>${accEsc(sub)}</small></div>`;
    }).join('')}</div>
    <h3 class="tt-h">Queues</h3><div id="qBoxes"></div>

  accRenderQueueBoxes(SUB_BOARDS); accBindBanner();
  const renderPending = async () => {
    const [mine] = await Promise.all([accLoadMine(), accPollMatches(), (accTesterKits().length || accIsRegulator()) ? accPollRequests() : null]);
    const box = accEl('ttPending'); if (!box) return;
    box.innerHTML = accPendingHtml(mine) + '<h3 class="tt-h">Your duels</h3>' + (accMatches.length ? accMatches.map(accMatchHtml).join('') : '<div class="acc-none">Duels you are assigned to will show here</div>') + accQueueHtml();
    box.querySelectorAll('[data-cancel]').forEach(b => b.onclick = async () => {

async function accViewSchedule(kit) {
  accStopTimers();
  const name = accProfile.mc_username, board = LEADERBOARDS[kit];
  accOpen(`<button class="tt-back" id="ttBack" type="button">&lsaquo; Tier tests</button><div class="acc-none">Loading...</div>`, true);
  accEl('ttBack').onclick = accViewTests;
  const [mine, hist] = await Promise.all([accLoadMine(), accLoadHistory()]);
  const st = accKitState(kit, hist, name), info = accTestInfo(kit, name, st);
  const pend = mine.find(r => r.status === 'pending' && r.kit === kit);
  const plan = info.mode === 'top' ? null : accAssign(kit, name, info, st);
  const blocked = info.mode === 'top' || !!pend || !!st.cooldownUntil;

  let note = '';
  if (info.mode === 'top') note = '<div class="tt-note">You are already HT1, the highest tier in this gamemode.</div>';
  else if (pend) note = `<div class="tt-note warn">You already have a pending test for this gamemode (${accEsc(accFmt(pend.requested_at))}). Cancel it from the Tier tests menu to schedule a new one.</div>`;
  else if (st.cooldownUntil) note = `<div class="tt-note warn">${accEsc(st.cooldownWhy)} You can request another test on ${accEsc(accDay(st.cooldownUntil))}.</div>`;
  else if (st.evalPassed) note = '<div class="tt-note good">You passed evaluation, so you can test for HT3 right away.</div>';
  else if (st.bridge && info.mode !== 'eval') note = '<div class="tt-note good">Bridging: you may test for the next tier immediately, and you do not need to beat an opponent from your own tier again.</div>';

  const planHtml = plan && info.mode !== 'eval' ? `<div class="acc-label">Your opponents</div><ol class="tt-plan">${plan.steps.map(s => `<li>${accEsc(s.title)}<br>${s.opponents.length ? oppChips(s.opponents) : '<span style="color:#8b8b96">No players available for this step</span>'}</li>`).join('')}</ol>` : '';
  const tz = new Date().getTimezoneOffset() * 60000;
  const today = new Date(Date.now() - tz).toISOString().slice(0, 10), max = new Date(Date.now() - tz + 59 * 864e5).toISOString().slice(0, 10);

  accEl('accBody').innerHTML = `<button class="tt-back" id="ttBack" type="button">&lsaquo; Tier tests</button>
    <div class="tt-head"><img src="${board.icon}" alt=""><div><h2>${accEsc(board.label)}</h2><div class="tt-type">${accEsc(info.type || 'Tier test')}</div></div></div>
    ${note}${planHtml}
    ${info.mode === 'eval' ? '<div class="acc-label">Evaluation queue</div><div id="qBoxes"></div>' : blocked ? '' : `<div class="acc-label">Pick a date and time (your local time)</div>
      <div class="tt-when"><input class="acc-in" id="tDate" type="date" min="${today}" max="${max}"><input class="acc-in" id="tTime" type="time"></div>
      <div class="acc-msg" id="aMsg"></div><button class="acc-go" id="aGo" type="button">Schedule test</button>`}
    ${info.mode === 'top' ? '' : accRulesHtml(kit, info)}`;
  accEl('ttBack').onclick = accViewTests;
  if (info.mode === 'eval') { accQElig[kit] = !blocked; accQueuePoll(); accRenderQueueBoxes([kit]); return; }
  if (blocked) return;
  accEl('aGo').onclick = async () => {
    const d = accEl('tDate').value, t = accEl('tTime').value;
    if (!d || !t) return accMsg('Pick a date and a time.');
    const when = new Date(`${d}T${t}`);
    if (isNaN(when) || when.getTime() < Date.now() + 30 * 60000) return accMsg('Pick a time at least 30 minutes from now.');
    accEl('aGo').disabled = true;
    const { data: ins, error } = await sb.from('tier_requests').insert({ user_id: accSession.user.id, mc_username: name, kit, test_type: info.type, opponents: plan, requested_at: when.toISOString() }).select('id').single();
    if (error) {
      accEl('aGo').disabled = false;
      return accMsg(error.code === '23505' ? 'You already have a pending test for this gamemode.' : 'Could not schedule the test. Check the date (max 60 days ahead).');
    }
    if (ins) await sb.rpc('sync_matches', { p_request: String(ins.id) });
    accMsg('Test scheduled! Testers have been notified.', 'ok');
    setTimeout(accViewTests, 1100);
  };
}

const accTesterKits = () => { const me = accMe(); return me ? SUB_BOARDS.filter(k => me.tester && me.tester[k]) : []; };

// ----- header UI + tester notifications -----
function accUpdateUI() {
  accEl('accBtn').querySelector('span').textContent = accProfile ? accProfile.mc_username : 'Log in';
  const active = accTesterKits().length > 0 || accIsRegulator();
  accEl('accBell').style.display = accProfile ? 'inline-flex' : 'none';
  if (accProfile && !accNotifTimer) { accPollAll(); accNotifTimer = setInterval(accPollAll, 8000); }
  if (!accProfile && accNotifTimer) { clearInterval(accNotifTimer); accNotifTimer = null; accNotifs = []; accNotifSeen = null; accMatches = []; accRenderBell(); }
  if (accProfile) accQStart(); else accQStop();
  const sig = `${accProfile ? accProfile.mc_username : ''}|${accTesterKits().join()}|${accIsRegulator()}`;
  if (sig === accRoleSig) return;
  accRoleSig = sig;
  clearInterval(accPollTimer); accPollTimer = null; accSeen = null;
  if (active) { accPollRequests(); accPollTimer = setInterval(accPollRequests, 15000); }
  else { accPending = []; }
}

  if (!accSession) { accProfile = null; accUpdateUI(); return; }

  accProfile = data || null; accUpdateUI();
}

let accNotifs = [], accNotifSeen = null, accNotifTimer = null, accMatches = [], accScoreShown = new Set(), accUnreadAtOpen = new Set(), accRefreshPending = null;
function accRenderPanel() { accRenderBell(); }

// ----- notification bell -----
function accRenderBell() {
  const n = accNotifs.filter(x => !x.read).length;
  accEl('bellBadge').style.display = n ? '' : 'none';
  accEl('bellNum').textContent = n > 9 ? '9+' : n;
  accEl('bellNum').setAttribute('font-size', n > 9 ? '96' : '130');

async function accOpenPanel() {
  accUnreadAtOpen = new Set(accNotifs.filter(x => !x.read).map(x => x.id));
  accRenderBell();
  if (!accUnreadAtOpen.size) return;
  const { error } = await sb.from('notifications').update({ read: true }).eq('user_id', accSession.user.id).eq('read', false);
  if (!error) { accNotifs.forEach(x => x.read = true); accRenderBell(); }
}
async function accPollNotifs() {
  if (!accSession) return;
  const { data, error } = await sb.from('notifications').select('id,message,created_at,read').eq('user_id', accSession.user.id).order('created_at', { ascending: false }).limit(30);

async function accPollAll() { await accPollNotifs(); await accPollMatches(); }

// ----- duels (matches between a testee and an assigned opponent) -----
async function accPollMatches() {
  if (!accSession) return;
  const uid = accSession.user.id;
  const { data, error } = await sb.from('test_matches').select('*').or(`testee_user.eq.${uid},opponent_user.eq.${uid}`).neq('status', 'completed').order('created_at');
  if (error) return;
  accMatches = data; accCheckScoreDue();
}
function accCheckScoreDue() {
  if (!accProfile || accEl('accModal').classList.contains('open')) return;
  const m = accMatches.find(x => x.status === 'scheduled' && x.scheduled_at && new Date(x.scheduled_at) <= new Date() && !accScoreShown.has(x.id));
  if (m) { accScoreShown.add(m.id); accViewScore(m); }
}
const accOtherSide = m => m.testee_user === accSession.user.id ? { uid: m.opponent_user, name: m.opponent_name } : { uid: m.testee_user, name: m.testee_name };
async function accMatchUpdate(m, vals, note) {
  const { error } = await sb.from('test_matches').update(vals).eq('id', m.id);
  if (error) { accToast('Could not save. Try again.'); return false; }
  Object.assign(m, vals);
  if (note) sb.rpc('match_notify', { p_match: m.id, p_message: note }).then(() => {}, () => {});
  return true;
}
const accRefreshAfter = () => { if (accRefreshPending && accEl('ttPending')) accRefreshPending(); accPollNotifs(); };

function accMatchHtml(m) {
  const uid = accSession.user.id, other = accOtherSide(m).name, mineTest = m.testee_user === uid;

  const tz = new Date().getTimezoneOffset() * 60000, today = new Date(Date.now() - tz).toISOString().slice(0, 10);
  return `<div class="mt-card" data-mid="${accEsc(m.id)}"><div class="mt-top"><img class="av" src="${avatarUrl(other, 60)}" alt="">
    <div><b>You vs ${accEsc(other)}</b><small>${accEsc(mineTest ? 'Your test' : m.testee_name + "'s test")} · ${accEsc(m.test_type || '')} · ${accEsc(m.kit || '')}</small></div></div>

function accBindMatches(box) {
  box.querySelectorAll('.mt-card').forEach(card => {
    const m = accMatches.find(x => String(x.id) === card.dataset.mid); if (!m) return;
    const q = sel => card.querySelector(sel), me = accProfile.mc_username;

    if (q('[data-deny]')) q('[data-deny]').onclick = async () => { if (await accMatchUpdate(m, { status: 'unscheduled', proposed_at: null, proposed_by: null, scheduled_at: null }, `${me} declined the suggested time for your ${m.test_type || 'test'} duel.`)) accRefreshAfter(); };

      if (await accMatchUpdate(m, { status: 'proposed', proposed_at: when.toISOString(), proposed_by: accSession.user.id, scheduled_at: null }, `${me} suggested ${accFmt(when)} for your ${m.test_type || 'test'} duel (${m.kit}).`)) accRefreshAfter();
    };
  });
}
function accViewScore(m) {
  const iAmTestee = m.testee_user === accSession.user.id, you = iAmTestee ? m.testee_name : m.opponent_name, them = iAmTestee ? m.opponent_name : m.testee_name;

// ----- tester: resolve a test -----
const RS_SCORES = [['4-0', 4, 0], ['4-1', 4, 1], ['4-2', 4, 2], ['4-3', 4, 3]];
// Triathlon: only the total margin over all 3 kits matters
const TRI_SCORES = [['Won by 1-2', 2, 0], ['Won by 3+', 3, 0], ['Lost', 0, 1]];
async function accSubmitResult(req, outcome) {
  const col = LEADERBOARDS[req.kit].col, now = new Date().toISOString();
  if (outcome.tier) {
    const cur = allPlayers.find(p => p.name.toLowerCase() === req.mc_username.toLowerCase());
    let peak = outcome.tier;
    if (cur && cur[`${req.kit}_peak_tier`] != null) { const pk = tierKey(cur[`${req.kit}_peak_tier`], !!cur[`${req.kit}_peak_plus`]); if (TIER_ORDER[pk] < TIER_ORDER[peak]) peak = pk; }
    const vals = { [`${col}_tier`]: keyLabel(outcome.tier), [`${col}_peaktier`]: keyLabel(peak) };
    let { data, error } = await sb.from('players').update(vals).ilike('player', req.mc_username.replace(/[\\_%]/g, '\\$&')).select('id');
    if (!error && (!data || !data.length)) ({ error } = await sb.from('players').insert({ player: req.mc_username, ...vals }));
    if (error) return 'Could not update the player\'s tier. Check the Supabase permissions.';
  }
  const result = { tier: outcome.tier ? keyLabel(outcome.tier) : null, eval_passed: !!outcome.eval_passed, bridge: !!outcome.bridge, score: outcome.score || null, side: outcome.side || null, tester: accProfile.mc_username };
  const { error } = await sb.from('tier_requests').update({ status: outcome.status, resolved_at: now, result }).eq('id', req.id);
  if (!error) sb.rpc('sync_matches', { p_request: String(req.id) }).then(() => {}, () => {});
  return error ? 'Tier saved, but the request could not be closed: ' + errText(error) : null;
}

async function accViewResolve(id) {
  const req = accPending.find(r => String(r.id) === String(id));
  if (!req) return;
  const kit = req.kit, me = accProfile.mc_username;
  if (accIsMe(req.mc_username)) return accToast('You cannot resolve your own test.');
  if (!accTesterKits().includes(kit)) return accToast('You are not a verified tester for ' + kit + '.');
  const isEval = req.test_type === 'Evaluation Test';
  const myKey = accPlayerKey(kit, me);
  const high = !!myKey && TIER_ORDER[myKey] <= TIER_ORDER['3+'];     // HT3 or above in this gamemode
  const plan = req.opponents || { steps: [] }, meta = plan.meta || {};
  const tm = /^([HL])T([1-5]) Test$/.exec(req.test_type || ''), target = tm ? tm[2] + (tm[1] === 'H' ? '+' : '') : null;
  const isTri = kit === 'Triathlon', isSword = kit === 'Sword', SCORES = isTri ? TRI_SCORES : RS_SCORES;
  // Sword scores are free round counts ("a-b"); bridging needs double the opponent's rounds, T1 needs 20-14 or better
  const swSc = score => { const m = /^(\d+)-(\d+)$/.exec(score || ''); return m ? ['' + score, +m[1], +m[2]] : null; };
  const findSc = score => isSword ? swSc(score) : SCORES.find(x => x[0] === score);
  const bridgeSc = (sc, tier) => isTri ? (sc[1] - sc[2] >= 3) : isSword ? ((tier === 1) ? (sc[1] >= 20 && sc[2] <= 14) : (sc[1] > sc[2] && sc[1] >= 2 * sc[2])) : (sc[1] - sc[2] >= 2);
  const bridgeOk = (score) => { const sc = findSc(score); return !!sc && target !== '1+' && bridgeSc(sc, target ? +target[0] : null); };
  let side = null, choice = null, score = null, opp2 = null;

  const getOpp2 = () => {
    let st = (plan.steps || []).find(x => x.kind === 'eval2');
    if (st) return st.opponents[0] || null;
    const pool = accTierPlayers(kit, myKey, me).filter(n => n.toLowerCase() !== req.mc_username.toLowerCase());
    const pick = pool.length ? accPick(pool) : null;
    if (pick) {
      plan.steps = [...(plan.steps || []), { kind: 'eval2', title: `Tester lost: play a ${keyLabel(myKey)} player (${isTri ? 'win overall' : isSword ? 'get at least ' + swordRoundsNeeded(myKey) + ' rounds' : 'win with 4-3 or better'})`, opponents: [pick], tier: myKey }];
      sb.from('tier_requests').update({ opponents: plan }).eq('id', req.id).then(() => sb.rpc('sync_matches', { p_request: String(req.id) })).then(() => {}, () => {});
    }
    return pick;
  };
  const opt = (val, cur, label, sub = '', cls = '') => `<button type="button" class="rs-opt ${cls} ${cur === val ? 'on' : ''}" data-v="${val}">${label}${sub ? `<small>${sub}</small>` : ''}</button>`;
  const scoreOpts = (cur, extra = '') => isSword ? `<div class="tt-when"><div><div class="acc-label">Testee rounds</div><input class="acc-in" id="swA" type="number" min="0" max="20" inputmode="numeric" value="${swSc(cur) ? swSc(cur)[1] : ''}"></div><div><div class="acc-label">Opponent rounds</div><input class="acc-in" id="swB" type="number" min="0" max="20" inputmode="numeric" value="${swSc(cur) ? swSc(cur)[2] : ''}"></div></div><div class="rs-opts one"><button type="button" class="rs-opt" data-sw="1">Set score</button>${extra}</div>` : `<div class="rs-opts">${(isTri ? SCORES.filter(x => x[1] > x[2]) : SCORES).map(x => opt(x[0], cur, x[0])).join('')}${extra}</div>`;

  const outcomeNow = () => {
    if (isEval) {
      if (side === 'won') {
        if (choice === 'PASS') return { status: 'passed', tier: '3', eval_passed: true, side };
        if (['5', '4', '3'].includes(choice)) return { status: 'passed', tier: choice, side };
      } else if (side === 'lost') {
        if (!high) return choice === 'PASS' ? { status: 'passed', tier: '3', eval_passed: true, side } : null;
        if (choice === 'GRANT') return { status: 'passed', tier: myKey, side };
        if (score === 'WORSE') return { status: 'passed', tier: '3', eval_passed: true, side, score };
        if (score) { const sc = findSc(score); return { status: 'passed', tier: myKey, bridge: !!sc && myKey !== '1+' && bridgeSc(sc, +myKey[0]), side, score }; }
      }
      return null;
    }
    if (choice === 'FAIL') return { status: 'failed', tier: null, side: 'failed' };
    if (choice === 'PASS' && score) return { status: 'passed', tier: target, bridge: bridgeOk(score), side: 'passed', score };

  };

  const draw = () => {
    let body = '';

      } else if (side === 'lost') {

          body += `<div class="rs-opts one">${opt('PASS', choice, 'Passed Evaluation', 'Assigns LT3 and lets them test for HT3 right away', 'pass')}</div>`;
        } else if (opp2) {

            <div class="acc-label">Assigned opponent</div><div style="margin-bottom:12px">${oppChips([opp2])}</div>
            <div class="acc-label">Testee's score against ${accEsc(opp2)}</div>${scoreOpts(score, opt('WORSE', score, isTri ? 'Lost overall' : 'Lost', 'Gets LT3 + Passed Evaluation', 'bad'))}`;
        } else {
          body += `<div class="tt-note warn">There is no other ${keyLabel(myKey)} player to assign, so the testee gets ${keyLabel(myKey)} directly.</div><div class="rs-opts one">${opt('GRANT', choice, 'Grant ' + keyLabel(myKey), '', 'pass')}</div>`;
        }
      }
    } else {
      body += `<div class="rs-seg">${opt('PASS', choice, 'Passed', '', 'pass')}${opt('FAIL', choice, 'Failed', '14 day cooldown', 'bad')}</div>`;
      if (choice === 'PASS') body += (isSword && target ? `<div class="tt-note">${keyLabel(target)}: the testee needs at least <b>${swordRoundsNeeded(target)} rounds</b> (first to ${swordFirstTo(target)}). Bridging needs ${+target[0] === 1 ? '20-14 or better' : 'double the opponent\'s rounds'}.</div>` : '') + `<div class="acc-label">${isTri ? 'Total result over all 3 kits' : 'Score of the final match'}</div>${scoreOpts(score)}`;

    bodyEl.querySelectorAll('[data-side]').forEach(b => b.onclick = () => {

      draw();
    });
    bodyEl.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => {
      const a = parseInt(accEl('swA').value, 10), c = parseInt(accEl('swB').value, 10);

    });
    bodyEl.querySelectorAll('.rs-opt[data-v]').forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      if (!isEval) { if (v === 'PASS' || v === 'FAIL') { choice = v; if (v === 'FAIL') score = null; } else score = v; }
      else if (side === 'lost' && high && opp2) score = v;
      else choice = v;
      draw();
    });
    accEl('aGo').onclick = async () => {
      const o = outcomeNow(); if (!o) return;
      accEl('aGo').disabled = true;
      const err = await accSubmitResult(req, o);
      if (err) { accEl('aGo').disabled = false; return accMsg(err); }
      accClose(); accToast(`${req.mc_username}: ${o.status === 'failed' ? 'test failed' : keyLabel(o.tier) + ' assigned'}`);
      accPollRequests(); loadPlayersAndRender(true);
    };
  };
  let reported = [];
  try { const { data } = await sb.from('test_matches').select('testee_name,opponent_name,score_testee,score_opponent').eq('request_id', String(req.id)).eq('status', 'completed'); reported = data || []; } catch (e) {}

let accQ = null, accQAt = 0, accQTimer = null, accQTick = null, accQKey = null, accQPhase = null, accQN = 0, accQBoxKits = null, accQErr = false;

const accQMine = k => (accQ?.mine || []).find(x => x.kit === k);
function accQBoxHtml(k) {

function accRenderQueueBoxes(kits) {

async function accQAction(a, k, btn) {
  btn.disabled = true;
  if (a === 'fav') {
    const on = !(accQ.favs || []).includes(k);
    const { error } = await sb.rpc('queue_fav', { p_kit: k, p_on: on });
    if (!error) { accQ.favs = on ? [...(accQ.favs || []), k] : (accQ.favs || []).filter(x => x !== k); accToast(on ? `You'll be notified when the ${k} queue opens.` : `Notifications for ${k} turned off.`); }
    else accToast('Could not save. Is supabase_queue.sql installed?');
  } else {
    const fn = { open: 'queue_open', close: 'queue_close', join: 'queue_join', leave: 'queue_leave' }[a];
    const { data, error } = await sb.rpc(fn, { p_kit: k });
    if (error || data !== 'ok') accToast(Q_MSG[data] || 'Something went wrong. Try again.');
    else {
      if (a === 'open') { accQConfirmShown[k] = false; accToast(`${k} queue opened. Confirm every 10 minutes.`); }
      if (a === 'join') accToast(`You joined the ${k} queue.`);
    }
  }
  await accQueuePoll(); accRenderQueueBoxes(accQBoxKits || [k]);
}
function accQBannerHtml() {
  const t = (accQ?.testing || [])[0], m = (accQ?.mine || []).find(x => x.status === 'testing');
  if (t) return `<div class="tt-note good q-banner"><span>Testing <b>${accEsc(t.testee)}</b> (${accEsc(t.kit)})</span><button type="button" class="q-btn" id="qResume">Open</button></div>`;
  if (m) return `<div class="tt-note good q-banner"><span>Your ${accEsc(m.kit)} evaluation with <b>${accEsc(m.tester || '')}</b> is in progress</span><button type="button" class="q-btn" id="qResume">Open</button></div>`;
  return '';
}
function accBindBanner() {
  const b = accEl('qResume'); if (!b) return;
  b.onclick = () => {
    const t = (accQ?.testing || [])[0], m = (accQ?.mine || []).find(x => x.status === 'testing');
    const row = t || m; if (!row) return;
    const ago = row.ago + (Date.now() - accQAt) / 1000;
    accQShowScreen(!!t, row, ago < QUEUE_ASSIGN_SECS ? 'duel' : 'assign');
  };
}
async function accOpenQResolve(rid) {
  const { data } = await sb.from('tier_requests').select('id,mc_username,kit,test_type,opponents,requested_at').eq('id', rid).maybeSingle();
  if (!data) return accToast('Could not load the test.');
  accPending = [data, ...accPending.filter(r => String(r.id) !== String(data.id))];
  await accViewResolve(String(data.id));
}
async function accQShowScreen(isTester, row, phase) {
  const left = Math.max(0, Math.ceil(QUEUE_ASSIGN_SECS - (row.ago + (Date.now() - accQAt) / 1000)));
  if (isTester) {
    if (phase === 'duel') {
      const cmd = `/duel ${row.testee}`;
      accOpen(`<h2>${accEsc(row.kit)} evaluation</h2>
        <div class="q-big">You can now ${accEsc(cmd)}</div>
        <div class="acc-copy"><code>${accEsc(cmd)}</code><button type="button" id="cpDuel">Copy</button></div>
        <p class="acc-p">The tier screen opens in <b id="qCount">${left}</b>s.</p>`);
      accEl('cpDuel').onclick = e => copyText(cmd, e.target);
    } else await accOpenQResolve(row.request_id);
  } else if (phase === 'duel') {
    accOpen(`<h2>${accEsc(row.kit)} evaluation</h2>
      <div class="q-big">Wait for and accept the duel requests from ${accEsc(row.tester || 'your tester')}</div>
      <p class="acc-p">Join the server and accept the /duel request in game. This screen changes in <b id="qCount">${left}</b>s.</p>`);
  } else {
    accOpen(`<h2>${accEsc(row.kit)} evaluation</h2>
      <div class="q-big">You will receive your tier soon</div>
      <p class="acc-p">You'll get a notification when your tier has been assigned.</p>
      <button class="acc-go ghost" id="qOk" type="button">Close</button>`);
    accEl('qOk').onclick = accClose;
  }
  accEl('accBody').dataset.q = '1';
}
function accQTickFn() {
  if (!accQ || !accProfile) return;
  const drift = (Date.now() - accQAt) / 1000;
  const t = (accQ.testing || [])[0], m = (accQ.mine || []).find(x => x.status === 'testing');
  const key = t ? 'T:' + t.request_id : m ? 'S:' + m.request_id : null;
  if (key !== accQKey) {
    const had = accQKey; accQKey = key; accQPhase = null;
    if (!key && had) { if (accEl('accBody').dataset.q) accClose(); accPollNotifs(); loadPlayersAndRender(true); }
  }
  if (key) {
    const row = t || m, ago = row.ago + drift, phase = ago < QUEUE_ASSIGN_SECS ? 'duel' : 'assign';
    if (phase !== accQPhase) { accQPhase = phase; accQShowScreen(!!t, row, phase); }
    const c = accEl('qCount'); if (c) c.textContent = Math.max(0, Math.ceil(QUEUE_ASSIGN_SECS - ago));
  }
  // testers must confirm their open queue every 10 minutes (not while testing someone)
  const open = accQ.tester_open || {};
  Object.keys(accQConfirmShown).forEach(k => { if (!open[k]) delete accQConfirmShown[k]; });
  document.querySelectorAll('.q-confirm').forEach(el => { if (!open[el.dataset.k]) el.remove(); });
  Object.keys(open).forEach(k => {
    const o = open[k], ago = o.ago + drift;
    if (o.busy || ago < 60) { accEl('qConf_' + k)?.remove(); if (ago < 60) accQConfirmShown[k] = false; return; }
    if (ago >= QUEUE_WARN_SECS && !accQConfirmShown[k]) { accQConfirmShown[k] = true; accQConfirmCard(k); }
    const c = accEl('qConf_' + k + '_t'); if (c) c.textContent = Math.max(0, Math.ceil(QUEUE_EXPIRE_SECS - ago));
  });
}
function accQConfirmCard(k) {
  const d = document.createElement('div'); d.className = 'q-confirm'; d.id = 'qConf_' + k; d.dataset.k = k;
  d.innerHTML = `<b>Is your ${accEsc(k)} queue still open?</b><small>It closes automatically in <span id="qConf_${k}_t">120</span>s.</small>
    <div class="q-confirm-btns"><button class="q-btn" type="button" data-c="yes">Still open</button><button class="q-btn grey" type="button" data-c="no">Close queue</button></div>`;
  document.body.appendChild(d);
  d.querySelector('[data-c=yes]').onclick = async () => { d.remove(); await sb.rpc('queue_confirm', { p_kit: k }); accQConfirmShown[k] = false; accQueuePoll(); };
  d.querySelector('[data-c=no]').onclick = async () => { d.remove(); await sb.rpc('queue_close', { p_kit: k }); accQueuePoll(); };
}
function accQStart() { if (accQTimer) return; accQueuePoll(); accQTimer = setInterval(accQueuePoll, 4000); accQTick = setInterval(accQTickFn, 1000); }
function accQStop() {
  clearInterval(accQTimer); clearInterval(accQTick); accQTimer = accQTick = null; accQ = null; accQKey = null; accQPhase = null;
  document.querySelectorAll('.q-confirm').forEach(e => e.remove());
}

async function initAuth() {
  const btn = accEl('accBtn'), hero = accEl('heroTest');
  try {
    const m = await import(SUPABASE_JS);
    sb = m.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  } catch (e) { console.error('Login unavailable:', e); accEl('accBellWrap').style.display = 'none'; btn.parentElement.style.display = 'none'; return; }

  sb.auth.onAuthStateChange((_ev, s) => { accSession = s; setTimeout(accRefreshProfile, 0); });

  btn.onclick = e => {
    e.stopPropagation();
    if (!accSession) return accViewLogin();
    const menu = accEl('accMenu'); accEl('accPanel').classList.remove('open');
    menu.innerHTML = '<button class="item" id="mReq" type="button">Tier tests</button><button class="item" id="mOut" type="button">Log out</button>';
    menu.classList.toggle('open');
    accEl('mReq').onclick = accViewTests;
    accEl('mOut').onclick = async () => { closeDrops(); await sb.auth.signOut(); };
  };
  hero.addEventListener('click', e => { e.preventDefault(); accSession ? accViewTests() : accViewRegister(); });
  hero.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); accSession ? accViewTests() : accViewRegister(); } });
  accEl('accBell').onclick = e => { e.stopPropagation(); accEl('accMenu').classList.remove('open'); if (accEl('accPanel').classList.toggle('open')) accOpenPanel(); };
  accEl('accPanel').onclick = e => e.stopPropagation();
  document.addEventListener('click', closeDrops);
  accEl('accX').onclick = accClose;
  accEl('accModal').addEventListener('mousedown', e => { if (e.target === accEl('accModal')) accClose(); });
  accEl('accModal').addEventListener('click', e => { if (!e.target.closest('#kitPop') && !e.target.closest('.tt-i')) closeKitPop(); });
}
initAuth();
</script>
<div class="acc-overlay" id="accModal"><div class="acc-box"><button class="acc-x" id="accX" type="button" aria-label="Close">&times;</button><div id="accBody"></div></div></div>
<div class="acc-toast-wrap" id="accToasts"></div>
</body>
